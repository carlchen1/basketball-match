services:
  - type: web
    name: basketball-match-auth
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9
      - key: DATABASE_URL
        fromDatabase:
          name: basketball-match-db
          property: connectionString
  - type: pserv
    name: basketball-match-db
    env: postgres
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all connections
