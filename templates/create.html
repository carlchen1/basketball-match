{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto mb-6">
  <h3 class="text-center mb-5">发布约球</h3>
  <form method="post">
    <div class="mb-4">
      <label class="form-label">球队名称</label>
      <input class="form-control p-3" name="team_name" required value="{{ current_user.team_name or '' }}">
    </div>
    <div class="mb-4">
      <label class="form-label">开始时间</label>
      <input class="form-control p-3" name="start_time" type="datetime-local" required>
    </div>
    <div class="mb-5">
      <label class="form-label">场地</label>
      <input class="form-control p-3" name="location" required>
    </div>
    <div class="mb-5">
      <label class="form-label">球队实力</label>
      <select class="form-control p-3" name="team_strength">
        <option value="">请选择球队实力</option>
        <option value="新手">新手</option>
        <option value="业余">业余</option>
        <option value="半专业">半专业</option>
        <option value="专业">专业</option>
      </select>
    </div>
    <button class="btn btn-primary btn-block-mobile w-100 p-3">发布</button>
  </form>
</div>
{% endblock %}
