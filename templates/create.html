{% extends 'base.html' %}
{% block content %}
<h3>发布约球</h3>
<form method="post" class="mt-3">
  <div class="mb-3">
    <label class="form-label">球队名称</label>
    <input class="form-control" name="team_name" required value="{{ current_user.team_name or '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">开始时间</label>
    <input class="form-control" name="start_time" type="datetime-local" required>
  </div>
  <div class="mb-3">
    <label class="form-label">场地</label>
    <input class="form-control" name="location" required>
  </div>
  <button class="btn btn-primary">发布</button>
</form>
{% endblock %}
