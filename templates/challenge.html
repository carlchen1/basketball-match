{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto mb-6">
  <h3 class="text-center mb-5">向 {{ match.team_name }} 发起约战</h3>
  <form method="post">
    <div class="mb-5">
      <label class="form-label">留言（可选）</label>
      <textarea class="form-control p-3" name="message" rows="4"></textarea>
    </div>
    <button class="btn btn-success btn-block-mobile w-100 p-3">提交约战</button>
  </form>
</div>
{% endblock %}
